<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- PWA（Claude Artifact に載せるときはこの範囲を使わないので、印の外に置く） -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マッスルラボ">
<!-- @artifact-start -->
<title>マッスルラボ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#080D18">
<style>
/* Layout: one-screen phone app. A scrolling view (header, capsule scene, cards) under a floating pill tab bar; sheets and full-screen flows sit above it. Single dark look by choice (a lab at night). */
:root{
  --bg:#080D18; --bg2:#0E1525; --panel:#131C30; --panel2:#1A2540; --line:rgba(150,180,255,.13); --line2:rgba(150,180,255,.24);
  --fg:#EAF1FF; --muted:#93A0BD; --dim:#5D6A88; --ink:#04231A;
  --mint:#58F0B8; --cyan:#5CC9FF; --amber:#FFB95C; --rose:#FF7D92; --violet:#A98BFF; --gold:#FFD76A;
  --display:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Zen Maru Gothic","M PLUS Rounded 1c",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  color-scheme:dark;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg)}
body{height:100%;margin:0;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  background:radial-gradient(70% 42% at 50% 16%,rgba(88,240,184,.09),transparent 72%),radial-gradient(60% 34% at 88% 92%,rgba(92,201,255,.06),transparent 70%),linear-gradient(rgba(150,180,255,.035) 1px,transparent 1px) 0 0/100% 28px,linear-gradient(90deg,rgba(150,180,255,.035) 1px,transparent 1px) 0 0/28px 100%,var(--bg)}
[hidden]{display:none!important}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg{display:block}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.ic.chev{width:16px;height:16px;color:var(--dim)}
.ic.ok{color:var(--mint)}
.ic.lk{color:var(--dim)}

/* 枠 */
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
#view{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-block:12px 108px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none;outline:none}
#view::-webkit-scrollbar{display:none}
#view.enter>.stack>*{animation:rise .5s cubic-bezier(.2,.8,.3,1) backwards}
#view.enter>.stack>*:nth-child(2){animation-delay:.05s}
#view.enter>.stack>*:nth-child(3){animation-delay:.1s}
#view.enter>.stack>*:nth-child(n+4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#layer{position:relative;z-index:50}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.row.gap>*{flex:1}
.col{display:flex;flex-direction:column;gap:8px}
#tabs{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(19,28,48,.86);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line2);box-shadow:0 14px 36px rgba(0,0,0,.55)}
.tab{display:flex;align-items:center;gap:7px;height:46px;padding:0 17px;border-radius:999px;color:var(--muted);font-family:var(--display);font-weight:800;font-size:13.5px;white-space:nowrap;transition:background .25s,color .25s,transform .15s}
.tab[aria-selected="true"]{background:var(--mint);color:var(--ink)}
.tab:active{transform:scale(.94)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:95;transform:translate(-50%,14px);width:max-content;max-width:min(92vw,440px);padding:11px 18px;border-radius:16px;background:rgba(234,241,255,.96);color:#0B1424;font-size:13.5px;font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1);box-shadow:0 12px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 文字 */
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow .ic{width:13px;height:13px}
.h1{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.3;letter-spacing:.01em;text-wrap:balance}
.h2{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.35}
.h3{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-top:8px}
.h3 small{font-family:var(--mono);font-weight:500;color:var(--dim)}
.note{font-size:13px;color:var(--muted);line-height:1.65}
.fine{font-size:11.5px;color:var(--dim);line-height:1.65}
.small{font-size:12px}
.muted{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* 部品 */
.card{display:flex;flex-direction:column;gap:12px;width:100%;background:linear-gradient(180deg,rgba(26,37,64,.9),rgba(19,28,48,.92));border:1px solid var(--line);border-radius:22px;padding:16px;text-align:left}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 18px;border-radius:17px;font-family:var(--display);font-weight:800;font-size:16.5px;letter-spacing:.02em;text-align:center;position:relative;overflow:hidden;transition:transform .15s,filter .2s,border-color .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,#6BF7C4,#35D3C9);color:var(--ink);box-shadow:0 10px 26px rgba(53,211,201,.26),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 32%,rgba(255,255,255,.4) 46%,transparent 60%);transform:translateX(-120%);animation:sheen 4.8s ease-in-out infinite}
@keyframes sheen{0%,62%{transform:translateX(-120%)}86%,100%{transform:translateX(120%)}}
.btn.amber{background:linear-gradient(135deg,#FFD08A,#FFA95C);color:#3A2100;box-shadow:0 10px 26px rgba(255,169,92,.24),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.sec{background:var(--panel2);border:1px solid var(--line2)}
.btn.ghost{min-height:44px;color:var(--muted);font-size:14px;font-weight:700}
.btn.on{background:rgba(255,185,92,.14);color:var(--amber);border:1px solid rgba(255,185,92,.4)}
.btn.danger{background:var(--rose);color:#3A0612}
.btn.sm{min-height:44px;font-size:14px;border-radius:14px;padding:0 12px}
.btn.sm .ic{width:17px;height:17px}
.btn.big{min-height:62px;font-size:18px;border-radius:20px}
.danger-t{color:var(--rose)!important}
.icobtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--muted);flex:none;transition:transform .15s,color .2s,border-color .2s}
.icobtn:active{transform:scale(.9)}
.icobtn.sm{width:34px;height:34px;border-radius:11px}
.icobtn.sm .ic{width:17px;height:17px}
.lnk{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;color:var(--cyan);font-size:13.5px;font-weight:700}
.lnk .ic{width:17px;height:17px}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;flex:none}
.pill .ic{width:13px;height:13px}
.pill.ok{background:rgba(88,240,184,.12);color:var(--mint)}
.pill.warn{background:rgba(255,185,92,.13);color:var(--amber)}
.pill.sm{height:20px;font-size:10.5px;padding:0 7px}
.ptags{display:flex;flex-wrap:wrap;gap:6px}
.ptag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12.5px;font-weight:700;flex:none}
.ptag i{width:8px;height:8px;border-radius:50%;flex:none}
.ptag.sub{color:var(--muted);font-weight:600}
.bar{display:block;flex:1;min-width:0;height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--mint);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.big{height:10px;flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:15px;background:var(--panel);border:1px solid var(--line)}
.seg button{min-height:40px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--muted);text-align:center;padding:0 4px;transition:background .2s,color .2s}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.stepper{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:14px;background:var(--panel);border:1px solid var(--line);flex:none}
.stepper button{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--panel2);transition:transform .1s}
.stepper button:active{transform:scale(.9)}
.stepper b,.stepper input{width:58px;text-align:right;font-family:var(--display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;background:none;border:0;padding:0;outline:none;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper .unit{font-size:12px;color:var(--muted);width:28px;padding-left:4px}
.tg{width:52px;height:31px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .25s}
.tg i{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tg.on{background:var(--mint)}
.tg.on i{transform:translateX(21px)}
.inp{width:100%;height:50px;padding:0 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line2);font-size:16px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--mint)}
.inp.big{height:62px;font-size:21px;font-family:var(--display);font-weight:800;text-align:center}
.ta{width:100%;min-height:130px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line2);font-family:var(--mono);font-size:16px;line-height:1.4;resize:vertical;outline:none;word-break:break-all}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;font-size:14.5px}
.frow .fl{display:flex;align-items:center;gap:8px}
.calc{display:flex;flex-direction:column}
.calc li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.calc li:first-child{border-top:0}
.calc span{display:flex;align-items:center;gap:7px;min-width:0;color:var(--muted)}
.calc b{white-space:nowrap;font-size:14px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--muted);white-space:nowrap}
.tag.off{background:rgba(255,125,146,.14);color:var(--rose)}

/* ホーム: ヘッダー */
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.rank{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.rank-badge{width:42px;height:42px;flex:none}
.emb{width:100%;height:100%;font-family:var(--display)}
.rank-t{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;max-width:190px}
.rank-name{font-family:var(--display);font-weight:800;font-size:15px;line-height:1.2}
.rpbar{height:4px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.rpbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--mint),var(--cyan));transition:width .8s}
.rank-sub{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.hd-r{display:flex;align-items:center;gap:8px;flex:none}
.streak{display:flex;align-items:center;gap:3px;height:38px;padding:0 12px 0 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--amber)}
.streak .ic{width:17px;height:17px}
.streak b{font-family:var(--display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.streak small{font-size:11px;color:var(--muted)}
.streak.off{color:var(--dim)}

/* ホーム: 培養カプセル */
.lab{position:relative;margin-block:-4px 0;margin-left:calc(0px - max(16px,env(safe-area-inset-left,0px)));margin-right:calc(0px - max(16px,env(safe-area-inset-right,0px)))}
.scene{width:100%;height:auto;max-height:min(62vh,440px)}
.capsule{cursor:pointer}
.bub{opacity:0;animation:bub linear infinite}
@keyframes bub{0%{transform:translateY(0);opacity:0}8%{opacity:.6}80%{opacity:.35}100%{transform:translateY(-262px);opacity:0}}
.led{animation:led 2.4s ease-in-out infinite}
@keyframes led{0%,100%{opacity:.35}50%{opacity:1}}
.aura{animation:aura 24s linear infinite}
.aura.a2{animation-duration:38s;animation-direction:reverse}
@keyframes aura{to{stroke-dashoffset:-260}}
.av-bob{animation:bob 5.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.12)}}
.sprout{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.rec{animation:rec 2.6s ease-in-out infinite}
@keyframes rec{0%,100%{opacity:.16}50%{opacity:.52}}
.scene.aurora .hue{animation:hue 14s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.chip{cursor:pointer;outline:none}
.chip-bg{fill:rgba(19,28,48,.9);stroke:rgba(150,180,255,.24);stroke-width:1;transition:stroke .2s,fill .2s}
.chip.is-rec .chip-bg{stroke:rgba(255,185,92,.6)}
.chip:focus-visible .chip-bg{stroke:var(--cyan);stroke-width:2}
.chip-n{font-family:var(--display);font-weight:800;font-size:12.5px;fill:var(--fg)}
.chip-l{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.lead{fill:none;stroke-width:1;stroke-opacity:.5;stroke-dasharray:2 3}
.np{display:flex;flex-direction:column;align-items:center;gap:3px;padding-inline:16px}
.np-row{display:flex;align-items:baseline;gap:10px}
.np-name{font-family:var(--display);font-weight:800;font-size:18px}
.np-lv{font-family:var(--mono);font-size:12px;color:var(--mint);letter-spacing:.04em}
.np-note{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim)}
.np-note i{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}

/* ホーム: カード */
.today{border-color:rgba(88,240,184,.28);box-shadow:0 16px 40px rgba(0,0,0,.28)}
.today.is-rest{border-color:rgba(255,185,92,.3)}
.today.is-done{border-color:var(--line)}
.est{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.est .ic{width:15px;height:15px}
.exl{display:flex;flex-direction:column}
.exl li{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.exl li:first-child{border-top:0}
.exl li span{min-width:0}
.exl em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.gains{display:flex;flex-wrap:wrap;gap:6px}
.gain{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.05);font-size:12.5px}
.gain i{width:8px;height:8px;border-radius:50%}
.gain b{font-family:var(--mono);color:var(--mint);font-size:12px}
.next{display:flex;align-items:center;gap:7px;font-size:13px}
.next .ic{width:16px;height:16px;color:var(--muted)}
.slim{flex-direction:row;align-items:center;gap:14px;padding:12px 14px;border-radius:20px;transition:border-color .2s,transform .15s}
.slim:active,.week:active{transform:scale(.985)}
.slim .ring{width:46px;height:46px;flex:none}
.slim-i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--panel2);color:var(--cyan);flex:none}
.slim-t{flex:1;min-width:0;display:flex;flex-direction:column}
.slim-t b{font-family:var(--display);font-size:15.5px}
.slim-t small{font-size:12px;color:var(--muted)}
.ring-t{font-family:var(--mono);font-size:10px;font-weight:700;fill:var(--fg)}
.ring-v{transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)}
.week{transition:transform .15s,border-color .2s}
.wds{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px}
.wd small{font-size:10.5px;color:var(--dim)}
.wd i{width:100%;max-width:38px;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid transparent}
.wd i .ic{width:15px;height:15px}
.wd.is-train i{background:rgba(88,240,184,.16);color:var(--mint);border-color:rgba(88,240,184,.35)}
.wd.is-rest i{background:rgba(255,185,92,.12);color:var(--amber);border-color:rgba(255,185,92,.3)}
.wd.is-miss i{background:transparent;border:1px dashed var(--line2)}
.wd.is-today small{color:var(--fg);font-weight:700}
.wd.is-today i{box-shadow:0 0 0 1.5px var(--fg)}
.memo{display:flex;flex-direction:column;gap:6px;padding:4px 6px 0}
.memo p{font-size:13px;color:var(--muted);line-height:1.7}

/* シート */
.ov{position:fixed;inset:0;z-index:80;display:flex;justify-content:center;align-items:flex-end;background:rgba(3,6,13,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.ov.on{opacity:1}
.ov.center{align-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:520px;max-height:90%;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;transform:translateY(28px);transition:transform .34s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.ov.center .sheet{max-width:400px;max-height:100%;border-radius:26px;border-bottom:1px solid var(--line2);padding-bottom:0;transform:scale(.94)}
.ov.on .sheet{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 6px 20px}
.sheet-b{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding-block:8px 24px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.ov.center .sheet-b{padding:22px 20px}
.cf{display:flex;flex-direction:column;gap:12px;text-align:center}
.pd{display:flex;flex-direction:column;gap:10px}
.pd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pd-lv{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.unlock{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:13px;background:var(--panel);font-size:12.5px;color:var(--muted)}
.unlock .ic{width:15px;height:15px}
.exlist{display:flex;flex-direction:column}
.exlist li{border-top:1px solid var(--line)}
.exlist li:first-child{border-top:0}
.exrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:46px;padding:6px 0;font-size:14.5px}
.exrow-n{min-width:0}
.exrow-s{display:flex;align-items:center;gap:6px;flex:none}
.exrow.is-lock{color:var(--dim)}
.exrow.is-ban .exrow-n{text-decoration:line-through;color:var(--dim)}
.cnt{font-family:var(--mono);font-size:11px;color:var(--mint)}
.exd{display:flex;flex-direction:column;gap:12px}
.exd-top{display:flex;gap:16px;align-items:center}
.exd-top .fig{width:104px;height:auto;flex:none}
.exd-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px}
.kv span{color:var(--muted)}
.kv b{font-size:13.5px}
.df{display:inline-flex;gap:3px}
.df i{width:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}
.df i.on{background:var(--amber)}
.how{font-size:14.5px;line-height:1.75}
.tip{display:flex;gap:8px;padding:10px 12px;border-radius:13px;background:rgba(92,201,255,.08);color:#BFE6FF;font-size:13px}
.tip .ic{width:17px;height:17px;margin-top:2px}
.rk-top{display:flex;align-items:center;gap:14px}
.rk-big{width:64px;height:64px;flex:none}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:42px;height:42px;border-radius:50%;background:var(--c);display:grid;place-items:center;border:3px solid var(--bg2);box-shadow:0 0 0 1.5px var(--line2);color:rgba(0,0,0,.6);transition:transform .15s,box-shadow .2s}
.sw.on{box-shadow:0 0 0 2.5px var(--fg)}
.sw:disabled{opacity:.3;cursor:default}
.sw .ic{width:16px;height:16px}
.rks{display:flex;flex-direction:column}
.rk{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);opacity:.5}
.rk:first-child{border-top:0}
.rk.is-done,.rk.is-cur{opacity:1}
.rk-e{width:34px;height:34px;flex:none}
.rk-t{flex:1;min-width:0;display:flex;flex-direction:column}
.rk-t b{font-size:14.5px}
.rk-t small{font-size:11.5px;color:var(--muted)}
.rk.is-cur .rk-t b{color:var(--mint)}
.wrep{display:flex;flex-direction:column;gap:14px}
.wrep-g{display:flex;align-items:center;gap:16px}
.wrep-g .h1{font-size:36px;line-height:1.1}
.wrep-g .h1 small{font-size:14px;color:var(--muted);margin-left:3px}
.wrep-rows{display:flex;flex-direction:column;gap:9px}
.wrep-rows li{display:grid;grid-template-columns:86px 1fr 58px;align-items:center;gap:10px;font-size:12.5px}
.wrep-rows b{font-family:var(--mono);font-size:11.5px;font-weight:500;text-align:right;color:var(--muted)}
.reward{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:14px;background:rgba(255,215,106,.1);color:var(--gold);font-weight:700;font-size:14px}
.reward .ic{width:17px;height:17px}
.grade{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;flex:none}
.grade.big{width:84px;height:84px;border-radius:26px;font-size:48px;animation:pop2 .6s cubic-bezier(.2,1.5,.4,1)}
.g-S{background:linear-gradient(135deg,#FFE08A,#FFB95C);color:#3A2400}
.g-A{background:linear-gradient(135deg,#7CF7D0,#35D3C9);color:var(--ink)}
.g-B{background:linear-gradient(135deg,#8FD8FF,#5C9BFF);color:#06203F}
.g-C{background:var(--panel2);color:var(--muted)}
.ru{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.ru-e{width:92px;height:92px;animation:pop2 .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop2{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.ru-l{display:flex;flex-direction:column;gap:6px;align-self:stretch;padding:12px 14px;border-radius:16px;background:var(--panel);font-size:13.5px;text-align:left}
.ru-l li{display:flex;align-items:center;gap:8px}
.ru-l .ic{width:17px;height:17px;color:var(--muted)}
.sw-dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin:0 1.5px}
.ru .col{align-self:stretch}

/* 食事 */
.nut{gap:14px}
.nut-k{display:flex;align-items:baseline;gap:8px}
.nut-k b{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.nut-k small{color:var(--muted);font-size:13px}
.nut-m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);min-width:0}
.mc i{width:18px;height:4px;border-radius:4px;margin-bottom:4px}
.mc span{font-size:11.5px;color:var(--muted)}
.mc b{font-family:var(--display);font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.mc b small{font-size:12px;color:var(--muted);margin-left:2px}
.charge{display:flex;align-items:center;gap:14px;padding:2px 4px}
.charge .ring{width:52px;height:52px;flex:none}
.charge div{display:flex;flex-direction:column;min-width:0}
.charge b{font-family:var(--display);font-size:15.5px}
.charge small{font-size:12px;color:var(--muted)}
.meal{gap:10px;transition:border-color .3s}
.meal.is-on{border-color:rgba(255,185,92,.45)}
.meal.flash .eg,.meal.flash .items,.meal.flash .mk{animation:rise .35s}
.eg{display:flex;align-items:center;gap:8px}
.eg-l{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--muted);flex:none}
.eg b{font-family:var(--display);font-size:16px}
.items{display:flex;flex-wrap:wrap;gap:6px}
.items li{padding:4px 10px;border-radius:9px;background:rgba(255,255,255,.05);font-size:12.5px}
.items li.add{background:rgba(255,185,92,.1);color:var(--amber)}
.items li.add small{margin-left:6px;opacity:.8;font-size:10.5px}
.mk{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.mk span:first-child{color:var(--fg)}

/* 記録 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px 10px;border-radius:16px;background:var(--panel);border:1px solid var(--line);min-width:0}
.tile small{font-size:11px;color:var(--muted)}
.tile b{font-family:var(--display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile b i{font-style:normal;font-size:11px;color:var(--muted);margin-left:2px}
.radar{width:100%;max-width:300px;height:auto;margin:0 auto}
.rd-n{font-family:var(--display);font-weight:800;font-size:12px}
.rd-l{font-family:var(--mono);font-size:9.5px;fill:var(--muted)}
.rd-s{font-family:var(--body);font-size:9px;fill:var(--dim)}
.pbars{display:flex;flex-direction:column;gap:2px}
.pbar{display:grid;grid-template-columns:54px 1fr 40px 50px;align-items:center;gap:10px;width:100%;min-height:36px}
.pbar-s{display:flex;justify-content:flex-end}
.pbar-n{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px}
.pbar-n i{width:8px;height:8px;border-radius:50%}
.pbar-l{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}
.cal-h{display:flex;align-items:center;justify-content:space-between}
.cal-h b{font-family:var(--display);font-size:16px}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-w span{text-align:center;font-size:10.5px;color:var(--dim)}
.cd{position:relative;aspect-ratio:1;border-radius:11px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.cd b{font-family:var(--mono);font-weight:600;font-size:12px}
.cd:disabled{cursor:default}
.cd.is-fut{opacity:.35}
.cd.is-train{background:rgba(88,240,184,.16);color:var(--mint);border-color:rgba(88,240,184,.35)}
.cd.is-rest{background:rgba(255,185,92,.1);color:var(--amber);border-color:rgba(255,185,92,.28)}
.cd.is-today{box-shadow:0 0 0 1.5px var(--fg)}
.cd i{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.cd u{width:3px;height:3px;border-radius:50%;background:var(--amber)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px}
.lg-train{background:rgba(88,240,184,.5)}
.lg-rest{background:rgba(255,185,92,.45)}
.legend i.lg-meal{width:5px;height:5px;border-radius:50%;background:var(--amber)}
.wt-in{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wt-in .btn{flex:1;min-width:150px}
.wchart{width:100%;height:auto}
.wt-a{font-family:var(--mono);font-size:9.5px;fill:var(--muted)}
.wlist{display:flex;flex-direction:column;gap:2px}
.wlist button{display:flex;align-items:center;gap:12px;width:100%;padding:8px 2px}
.wlist-t{flex:1;min-width:0;display:flex;flex-direction:column}
.wlist-t b{font-size:14px}
.wlist-t small{font-size:11.5px;color:var(--muted)}
.wlist em{font-style:normal;font-family:var(--mono);font-size:12.5px;color:var(--muted)}

/* 全画面（はじめての設定・実験） */
.full{position:fixed;inset:0;z-index:70;display:flex;justify-content:center;opacity:0;transform:translateY(16px);transition:opacity .28s,transform .34s cubic-bezier(.2,.9,.3,1);background:radial-gradient(70% 42% at 50% 10%,rgba(88,240,184,.09),transparent 72%),var(--bg)}
.full.on{opacity:1;transform:none}
.full-in{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sp{display:block;width:38px;height:38px}
.ob-top{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:12px;min-height:38px}
.ob-dots{display:flex;justify-content:center;gap:6px}
.ob-dots i{width:22px;height:4px;border-radius:9px;background:rgba(255,255,255,.12);transition:background .3s}
.ob-dots i.on{background:var(--mint)}
.ob-n{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.ob-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:6px}
.ob-body.is-hero{justify-content:center;align-items:center;text-align:center;gap:6px}
.ob-hero{width:100%;max-width:380px;min-height:0}
.ob-hero .scene{max-height:50vh}
.ob-copy{display:flex;flex-direction:column;align-items:center;gap:6px}
.ob-title{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.04em;line-height:1.2;color:var(--fg)}
.ob-copy p{color:var(--muted);font-size:14.5px}
.ob-q{display:flex;flex-direction:column;gap:4px;margin-bottom:4px}
.ob-sum{padding:4px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--panel);border:1.5px solid var(--line);transition:border-color .2s,background .2s,transform .15s}
.opt:active{transform:scale(.98)}
.opt.on{border-color:var(--mint);background:rgba(88,240,184,.08)}
.opt-i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--panel2);color:var(--mint);flex:none}
.opt-t{flex:1;min-width:0;display:flex;flex-direction:column}
.opt-t b{font-family:var(--display);font-size:16.5px}
.opt-t small{color:var(--muted);font-size:12.5px}
.opt-c{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line2);color:transparent;flex:none;transition:background .2s,border-color .2s,color .2s}
.opt-c .ic{width:15px;height:15px}
.opt.on .opt-c{background:var(--mint);border-color:var(--mint);color:var(--ink)}
.ob-foot{display:flex;flex-direction:column;gap:8px}
.ob-foot .fine{text-align:center}
.wk-top{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:12px;min-height:40px}
.wk-ttl{display:flex;flex-direction:column;min-width:0}
.wk-ttl b{font-family:var(--display);font-size:18px;line-height:1.25}
.wk-prog{display:flex;flex-direction:column;gap:5px;min-width:0}
.wk-prog .bar{flex:none}
.wk-prog small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.wk-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-block:4px}
/* 縦に並べてスクロールする入れ物では、中身を縮ませない（縮むと入力欄などがつぶれる）。図だけは縮んでよい */
.sheet-b>*,.wk-scroll>*,.wk-mid>*,.ob-body>*{flex-shrink:0}
.wk-mid>.wk-fig,.ob-body>.ob-hero{flex-shrink:1}
.wk-scroll,.wk-mid,.ob-body{scrollbar-width:none}
.wk-scroll::-webkit-scrollbar,.wk-mid::-webkit-scrollbar,.ob-body::-webkit-scrollbar{display:none}
.sheet-b{scrollbar-width:thin;scrollbar-color:rgba(150,180,255,.24) transparent}
.wl{display:flex;flex-direction:column;gap:8px}
.wl-i{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.wl-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px}
.wl-main>i{width:6px;height:36px;border-radius:6px;flex:none}
.wl-t{display:flex;flex-direction:column;min-width:0}
.wl-t b{font-family:var(--display);font-size:15.5px}
.wl-t small{font-size:12px;color:var(--muted)}
.wk-foot{display:flex;flex-direction:column;gap:6px}
.wk-mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;overflow-y:auto}
.wk-fig{height:min(26vh,190px);min-height:90px;flex:0 1 auto}
.wk-fig .fig{height:100%;width:auto}
.wk-name{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.3;text-wrap:balance}
.wk-set{font-family:var(--mono);font-size:13px;color:var(--muted)}
.wk-set b{color:var(--fg);font-size:17px}
.wk-reps{display:flex;align-items:center;gap:18px}
.wk-num{display:flex;flex-direction:column;align-items:center;min-width:120px}
.wk-num b{font-family:var(--display);font-weight:800;font-size:68px;line-height:1;font-variant-numeric:tabular-nums}
.wk-num b.pop{animation:pop .22s}
@keyframes pop{from{transform:scale(1.14)}to{transform:scale(1)}}
.wk-num small{font-size:13px;color:var(--muted);font-weight:700}
.rbtn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);flex:none;transition:transform .12s,border-color .2s}
.rbtn:active{transform:scale(.9)}
.rbtn.sm{width:38px;height:38px}
.rbtn.sm .ic{width:16px;height:16px}
.wk-kg{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.wk-kg b{min-width:76px;color:var(--fg);font-family:var(--mono);font-size:15px}
.timer{position:relative;width:min(58vw,230px);max-width:100%;aspect-ratio:1}
.timer svg{width:100%;height:100%}
.tm-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:10}
.tm-v{fill:none;stroke:var(--amber);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .2s linear}
.timer.run .tm-v{stroke:var(--mint)}
.timer-n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-n b{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.timer-n small{color:var(--muted);font-size:13px;font-weight:700}
.wk-next{display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:12.5px}
.wk-next b{color:var(--fg);font-size:16px;font-family:var(--display)}
.feels{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:8px}
.feel{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);text-align:left;transition:transform .15s,border-color .2s}
.feel:active{transform:scale(.98)}
.feel-g{display:flex;align-items:flex-end;gap:4px;height:30px;width:34px;flex:none}
.feel-g i{flex:1;border-radius:3px;background:rgba(255,255,255,.12)}
.feel-g i:nth-child(1){height:40%}
.feel-g i:nth-child(2){height:70%}
.feel-g i:nth-child(3){height:100%}
.feel-g i.on{background:var(--mint)}
.feel[data-v="ok"] .feel-g i.on{background:var(--gold)}
.feel[data-v="hard"] .feel-g i.on{background:var(--rose)}
.feel-t{flex:1;min-width:0;display:flex;flex-direction:column}
.feel-t b{font-family:var(--display);font-size:16.5px}
.feel-t small{color:var(--muted);font-size:12.5px}
.wk-scroll.res>.eyebrow{align-self:center}
.wk-scroll.res>.wk-name{text-align:center}
.res-av{height:min(30vh,230px);display:flex;justify-content:center;flex:none}
.res-av svg{height:100%;width:auto;overflow:visible}
.res-list{display:flex;flex-direction:column;gap:10px}
.res-row{display:grid;grid-template-columns:54px 1fr auto 42px;align-items:center;gap:10px;font-size:13.5px}
.res-n{display:flex;align-items:center;gap:6px;font-weight:700}
.res-n i{width:8px;height:8px;border-radius:50%}
.res-l{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.res-l b{color:var(--gold)}
.res-row em{font-style:normal;font-family:var(--mono);font-size:12.5px;color:var(--mint);text-align:right}
.res-row.is-up .res-n{color:var(--gold)}
.res-notes{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.res-notes li{display:flex;align-items:center;gap:8px}
.res-notes .ic{width:16px;height:16px;color:var(--muted)}
.res-notes .hl,.res-notes .hl .ic{color:var(--gold)}

@media(hover:hover){
  .btn.pri:hover,.btn.amber:hover{filter:brightness(1.07)}
  .btn.sec:hover,.icobtn:hover,.opt:hover,.feel:hover,.slim:hover,.week:hover,.wl-i:hover{border-color:var(--mint)}
  .icobtn:hover,.btn.ghost:hover,.tab:hover{color:var(--fg)}
  .tab[aria-selected="true"]:hover{color:var(--ink)}
  .chip:hover .chip-bg{stroke:var(--mint);fill:rgba(26,37,64,.96)}
  .exrow:hover .exrow-n{color:var(--mint)}
  .sw:not(:disabled):hover{transform:scale(1.08)}
}
@media(max-height:640px){
  .wk-fig{height:104px}
  .wk-num b{font-size:54px}
  .wk-name{font-size:21px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>

  s.parts=parts;

/* ---------- 4. ルール ---------- */
// レベル: 次のレベルまでの経験値は 60, 85, 110 … と25ずつ増える
const needFor=L=>60+25*(L-1);
function lvInfo(exp){
  let L=1,e=Math.max(0,exp||0);
  while(L<99&&e>=needFor(L)){ e-=needFor(L); L++; }
  const need=needFor(L);
  return {lv:L,cur:Math.round(e),need,frac:L>=99?1:clamp(e/need,0,1)};
}
// 見た目の育ち具合（0〜1）。Lv.30 で最大。序盤ほど変化が大きい
const growthOf=exp=>{ const i=lvInfo(exp); return Math.pow(clamp((i.lv-1+i.frac)/29,0,1),.75); };
const growthAll=src=>{ const g={}; PARTS.forEach(p=>{ g[p.id]=growthOf(src?src[p.id]:S.parts[p.id].exp); }); return g; };
const expSnap=()=>{ const o={}; PARTS.forEach(p=>{ o[p.id]=S.parts[p.id].exp; }); return o; };
const totalLv=()=>PARTS.reduce((s,p)=>s+lvInfo(S.parts[p.id].exp).lv,0);

// 研究ランク
function rankIdx(rp){ const v=rp==null?S.rp:rp; let i=0; for(let k=0;k<RANKS.length;k++) if(v>=RANKS[k].rp) i=k; return i; }
const pending={rank:null,week:null};   // 画面に出すのを待っている出来事
function gainRP(n){ if(!n) return; const b=rankIdx(); S.rp=Math.max(0,S.rp+n); const a=rankIdx(); if(a>b) pending.rank=a; }

// 回復: 鍛えた日から rec 日たつまでは「回復中」
function recLeft(pid,date){ const last=S.parts[pid].last; if(!last) return 0; const d=diffDays(last,date); if(d<0) return 0; return Math.max(0,PART[pid].rec-d); }
const isReady=(pid,date)=>recLeft(pid,date)===0;

// その日が実験の日か回復日かを決める
const trainedOn=date=>{ const d=S.days[date]; return !!(d&&d.t==='train'&&d.done); };
function decideType(date){
  const f=S.profile.freq;
  let t6=0; for(let i=1;i<=6;i++) if(trainedOn(addDays(date,-i))) t6++;
  let consec=0; for(let i=1;i<=7;i++){ if(trainedOn(addDays(date,-i))) consec++; else break; }
  let since=99; for(let i=1;i<=14;i++){ if(trainedOn(addDays(date,-i))){ since=i; break; } }
  const maxC=f<=3?1:f===4?2:f===5?3:6;
  const gap=Math.max(1,Math.floor(7/f));
  if(!PARTS.some(p=>isReady(p.id,date)&&candidates(p.id).length)) return 'rest';
  if(t6>=f) return 'rest';
  if(consec>=maxC) return 'rest';
  if(since<gap) return 'rest';
  return 'train';
}

// メニュー作り
function candidates(pid){
  const lv=lvInfo(S.parts[pid].exp).lv, er=equipRank(S.profile.equip);
  return EX.filter(x=>x.part===pid&&EQN[x.eq]<=er&&x.lv<=lv&&!(S.ex[x.id]&&S.ex[x.id].ban));
}
function scoreEx(x,date,salt){
  const er=equipRank(S.profile.equip), st=S.ex[x.id]||{};
  let s=x.lv+(EQN[x.eq]===er?3.2:EQN[x.eq]===er-1?1.2:0);
  if(st.last){ const d=diffDays(st.last,date); if(d>=0&&d<=3) s-=1.4; }
  return s+rnd(date+'|'+x.id+'|'+(salt||0))*2.4;
}
const ranked=(pid,date,salt)=>candidates(pid).map(e=>({e,s:scoreEx(e,date,salt)})).sort((a,b)=>b.s-a.s).map(o=>o.e);
function planShape(){ const m=S.profile.minutes; return m<=10?{N:3,K:2,sets:2}:m<=20?{N:5,K:3,sets:3}:{N:7,K:4,sets:3}; }
function pickParts(date,K){
  const list=PARTS.filter(p=>isReady(p.id,date)&&candidates(p.id).length).map((p,i)=>{
    const last=S.parts[p.id].last;
    return {id:p.id,since:last?Math.max(0,diffDays(last,date)):999,lv:lvInfo(S.parts[p.id].exp).lv,i:PARTS.indexOf(p)};
  });
  list.sort((a,b)=>(b.since-a.since)||(a.lv-b.lv)||(a.i-b.i));
  return list.slice(0,K).map(x=>x.id);
}
const repCap=e=>e.sec?120:(e.w?15:Math.max(e.base*2,20));
function targetReps(e){
  const st=S.ex[e.id]||{}, adj=st.adj||0, cut=S.profile.goal==='cut';
  if(e.sec) return clamp(e.base+adj*5+(cut?5:0),10,120);
  return clamp(e.base+adj+(cut?2:0),3,repCap(e)+(cut?2:0));
}
function restSec(e){ const g=S.profile.goal; return g==='cut'?30:(g==='bulk'&&e.w?60:45); }
function estMin(items){
  let sec=0;
  items.forEach(it=>{ const e=EXM[it.id]; const work=e.sec?it.reps*(e.each?2:1):Math.min(75,it.reps*3.2*(e.each?2:1)); sec+=it.sets*(work+restSec(e))+20; });
  return Math.max(1,Math.round(sec/60));
}
function buildPlan(date,salt){
  const sh=planShape(), parts=pickParts(date,sh.K);
  if(!parts.length) return null;
  const pool={}, cnt={};
  parts.forEach(x=>{ pool[x]=ranked(x,date,salt); cnt[x]=0; });
  let n=0, go=true;
  while(n<sh.N&&go){ go=false; for(const x of parts){ if(n>=sh.N) break; if(cnt[x]<Math.min(3,pool[x].length)){ cnt[x]++; n++; go=true; } } }
  const order=parts.slice().sort((a,b)=>(a==='abs'?1:0)-(b==='abs'?1:0));
  const items=[];
  order.forEach(x=>{ pool[x].slice(0,cnt[x]).sort((a,b)=>b.df-a.df).forEach(e=>items.push({id:e.id,sets:sh.sets,reps:targetReps(e)})); });
  return {parts:order,items,est:estMin(items)};
}
const hasSets=c=>!!(c&&c.prog&&c.prog.sets.some(a=>a.length));
const setsDoneOf=c=>(c&&c.prog)?c.prog.sets.reduce((s,a)=>s+a.length,0):0;
const setsAllOf=c=>(c&&c.plan)?c.plan.items.reduce((s,it)=>s+it.sets,0):0;
function initProg(){ const c=S.cur; if(!c.prog) c.prog={i:0,sets:c.plan.items.map(()=>[]),skip:[]}; return c.prog; }
function swapItem(idx){
  const c=S.cur, it=c.plan.items[idx]; if(!it) return false;
  if(c.prog&&(c.prog.sets[idx]||[]).length) return false;
  const e=EXM[it.id], used=new Set(c.plan.items.map(x=>x.id));
  const list=ranked(e.part,c.date,c.salt||0).filter(x=>!used.has(x.id)||x.id===e.id);
  const i=list.findIndex(x=>x.id===e.id);
  if(list.length<2&&i>=0) return false;
  if(!list.length) return false;
  const nx=list[(i+1)%list.length];
  c.plan.items[idx]={id:nx.id,sets:it.sets,reps:targetReps(nx)};
  c.plan.est=estMin(c.plan.items);
  return true;
}

// 1日のはじまり
function newCur(date){
  const type=decideType(date);
  const c={date,type,plan:null,prog:null,finished:false,done:false,base:{},bonus:{},manual:false,salt:0,
    meals:{b:{on:false,k:0},l:{on:false,k:0},d:{on:false,k:0},s:{on:false,k:0}}};
  if(type==='train'){ c.plan=buildPlan(date,0); if(!c.plan) c.type='rest'; }
  return c;
}
function validCur(c){
  if(!c||typeof c.date!=='string'||!c.meals) return false;
  if(!SLOTS.every(s=>c.meals[s.id])) return false;
  if(c.type==='train'){
    if(!c.plan||!Array.isArray(c.plan.items)||!c.plan.items.length) return false;
    if(c.plan.items.some(it=>!EXM[it.id])) return false;
    if(c.prog&&(!Array.isArray(c.prog.sets)||c.prog.sets.length!==c.plan.items.length)) return false;
  }
  return true;
}
function startDay(){
  const t=today(); let fresh=false;
  if(S.cur&&!validCur(S.cur)) S.cur=null;
  if(S.cur&&S.cur.date!==t){
    // 前の日に途中で終わった実験は、できた分だけ集計する
    if(S.cur.type==='train'&&!S.cur.finished&&hasSets(S.cur)) finishWorkout('ok');
    S.cur=null;
  }
  if(!S.cur){ S.cur=newCur(t); fresh=true; }
  checkWeekly();
  save();
  return fresh;
}
function dayRec(date,type){ let d=S.days[date]; if(!d) d=S.days[date]={t:type||'rest',done:0}; return d; }

// 連続日数（実験した日も、回復を記録した日も数える）
const STREAK_BONUS={3:30,7:70,14:150,30:300,50:500,100:1000,200:2000,365:3650};
function bumpStreak(date){
  const s=S.streak;
  if(s.last===date) return 0;
  if(s.last&&diffDays(s.last,date)===1) s.cur++; else s.cur=1;
  s.last=date; s.best=Math.max(s.best||0,s.cur);
  const b=STREAK_BONUS[s.cur]||0; if(b) gainRP(b);
  return b;
}
function streakNow(){ const s=S.streak; if(!s.last) return 0; const d=diffDays(s.last,today()); return (d===0||d===1)?s.cur:0; }

// 栄養チャージ: 食事を記録した数（最大4）で、その日の経験値に最大 +50% のボーナス
const chargeOf=c=>SLOTS.filter(s=>c.meals[s.id].on).length/4;
function syncBonus(){
  const c=S.cur; if(!c||!c.finished) return 0;
  const ch=chargeOf(c); let total=0;
  Object.keys(c.base).forEach(pid=>{
    const target=Math.round(c.base[pid]*.5*ch), cur=c.bonus[pid]||0, d=target-cur;
    if(d){ S.parts[pid].exp=Math.max(0,S.parts[pid].exp+d); c.bonus[pid]=target; }
    total+=target;
  });
  const day=S.days[c.date]; if(day) day.bonus=total;
  return total;
}
function toggleMeal(sid){
  const c=S.cur, m=c.meals[sid], before=expSnap();
  m.on=!m.on;
  if(m.on) gainRP(5); else S.rp=Math.max(0,S.rp-5);
  const day=dayRec(c.date,c.type); day.meals=SLOTS.filter(s=>c.meals[s.id].on).map(s=>s.id).join('');
  syncBonus(); save();
  const ups=[]; PARTS.forEach(p=>{ const a=lvInfo(before[p.id]).lv,b=lvInfo(S.parts[p.id].exp).lv; if(b>a) ups.push({pid:p.id,from:a,to:b}); });
  return {on:m.on,levelUps:ups};
}

// 実験の集計
function applyAdj(e,st,it,d){
  const cap=repCap(e); let up=false;
  if(e.w&&!e.sec&&d>0&&it.reps>=cap){ st.adj=0; up=true; if(st.kg) st.kg=Math.round((st.kg+(e.eq==='g'?2.5:1))*2)/2; }
  else st.adj=(st.adj||0)+d;
  const lo=e.sec?-Math.max(0,Math.floor((e.base-10)/5)):-Math.min(4,e.base-3);
  const hi=e.sec?Math.floor((cap-e.base)/5):cap-e.base;
  st.adj=clamp(st.adj,lo,hi);
  return up;
}
function finishWorkout(feel){
  const c=S.cur;
  if(!c||c.type!=='train'||c.finished||!hasSets(c)) return null;
  const before=expSnap(), rkBefore=rankIdx(), base={}, prim=[], exIds=[], ups=[];
  let setsDone=0, setsAll=0;
  c.plan.items.forEach((it,idx)=>{
    const e=EXM[it.id], arr=c.prog.sets[idx]||[];
    setsAll+=it.sets;
    if(!arr.length) return;
    setsDone+=arr.length;
    const gain=10*(.8+.2*e.df)*arr.length;
    base[e.part]=(base[e.part]||0)+gain;
    e.sub.forEach(sp=>{ base[sp]=(base[sp]||0)+gain*.4; });
    if(!prim.includes(e.part)) prim.push(e.part);
    const st=S.ex[e.id]||(S.ex[e.id]={n:0,adj:0});
    st.n=(st.n||0)+1; st.last=c.date;
    // 次回の回数: 感想と、実際にできた回数から決める
    const avg=arr.reduce((a,b)=>a+b,0)/arr.length, unit=e.sec?5:1;
    let d=feel==='easy'?2:feel==='hard'?-2:1;
    if(avg<it.reps-unit*.5) d-=1; else if(avg>it.reps+unit*.5) d+=1;
    if(arr.length<it.sets) d=Math.min(d,0);
    if(applyAdj(e,st,it,d)) ups.push(e.name);
    exIds.push(e.id);
  });
  Object.keys(base).forEach(k=>{ base[k]=Math.round(base[k]); });
  c.base=base; c.bonus={}; c.finished=true; c.done=true; c.feel=feel;
  prim.forEach(pid=>{ S.parts[pid].last=c.date; });
  Object.keys(base).forEach(pid=>{ S.parts[pid].exp+=base[pid]; });
  const day=dayRec(c.date,'train');
  day.t='train'; day.done=1; day.sets=setsDone; day.exp=Object.assign({},base); day.pp=prim.slice(); day.feel=feel; day.ex=exIds;
  const bonus=syncBonus();
  S.totals.sessions++; S.totals.sets+=setsDone;
  const after=expSnap(), levelUps=[], unlocks=[], er=equipRank(S.profile.equip);
  const full=setsDone>=setsAll*.5;
  let rp=full?50:20;
  PARTS.forEach(p=>{
    const a=lvInfo(before[p.id]).lv, b=lvInfo(after[p.id]).lv;
    if(b>a){
      levelUps.push({pid:p.id,from:a,to:b}); rp+=10*(b-a);
      EX.forEach(x=>{ if(x.part===p.id&&x.lv>a&&x.lv<=b&&EQN[x.eq]<=er) unlocks.push(x.name); });
    }
  });
  gainRP(rp);
  const sb=bumpStreak(c.date);
  save();
  return {before,after,base,bonus,levelUps,unlocks,rp,full,setsDone,setsAll,streak:S.streak.cur,streakBonus:sb,weightUps:ups,rankUp:rankIdx()>rkBefore};
}
function restCheckIn(){
  const c=S.cur; if(!c||c.done) return null;
  c.type='rest'; c.plan=null; c.prog=null; c.done=true;
  const day=dayRec(c.date,'rest'); day.t='rest'; day.done=1;
  S.totals.rests++;
  gainRP(20);
  const sb=bumpStreak(c.date);
  save();
  return {rp:20,streak:S.streak.cur,streakBonus:sb};
}
function setRestToday(){ const c=S.cur; if(!c||c.done||hasSets(c)) return false; c.type='rest'; c.plan=null; c.prog=null; c.manual=true; save(); return true; }
function setTrainToday(){
  const c=S.cur; if(!c||c.done) return false;
  const plan=buildPlan(c.date,c.salt||0); if(!plan) return false;
  c.type='train'; c.plan=plan; c.prog=null; c.manual=true; save(); return true;
}
// 設定を変えたとき、まだ始めていなければ今日のメニューを作り直す
function replanToday(){
  const c=S.cur; if(!c||c.done||hasSets(c)||c.type!=='train') return false;
  const plan=buildPlan(c.date,c.salt||0); if(!plan) return false;
  c.plan=plan; c.prog=null; save(); return true;
}
const nextDayType=()=>decideType(addDays(S.cur?S.cur.date:today(),1));

// 食事の目安（Mifflin-St Jeor の式で基礎代謝を出し、活動量と目的で調整する）
function nutrition(){
  const p=S.profile, off=p.sex==='m'?5:p.sex==='f'?-161:-78;
  const bmr=10*p.weight+6.25*p.height-5*p.age+off;
  const act=1.3+.03*p.freq+(p.minutes>=30?.05:0);
  const tdee=bmr*act, minor=p.age<18;
  let k=tdee;
  if(p.goal==='bulk') k=tdee*1.1;
  else if(p.goal==='cut'&&!minor) k=Math.max(tdee*.85,tdee-500);
  k=Math.max(k,bmr,p.sex==='m'?1500:1200);
  k=Math.round(k/50)*50;
  const per=p.goal==='bulk'?1.8:p.goal==='cut'?2:1.4;
  const prot=Math.round(Math.min(p.weight*per,200)/5)*5;
  const fat=Math.round(k*.25/9/5)*5;
  const carb=Math.max(0,Math.round((k-prot*4-fat*9)/4/5)*5);
  return {k,p:prot,f:fat,c:carb,bmr:Math.round(bmr),tdee:Math.round(tdee),minor,per};
}
function slotTarget(sid){ const n=nutrition(), s=SLOT[sid]; return {k:n.k*s.k,p:n.p*s.p}; }
function fitMeal(m,tg){
  let k=m.k,p=m.p,f=m.f,c=m.c; const items=m.items.slice();
  if(m.rice){
    let best=RICE[0], bd=1e9;
    RICE.forEach(r=>{ const d=Math.abs(k+1.56*r[0]-tg.k); if(d<bd){ bd=d; best=r; } });
    const g=best[0]; k+=1.56*g; p+=.025*g; f+=.003*g; c+=.371*g;
    items.push('ごはん '+g+'g（'+best[1]+'）');
  }
  const adds=[], def=tg.p-p;
  let a=null;
  if(def>=14&&k+ADDON.protein.k<=tg.k*1.3) a=ADDON.protein;
  else if(def>=6&&k+ADDON.egg.k<=tg.k*1.3) a=ADDON.egg;
  const put=x=>{ adds.push({n:x.n,why:x.why}); k+=x.k; p+=x.p; f+=x.f; c+=x.c; };
  if(a) put(a);
  // ごはんを上限まで足してもカロリーが足りないときは、牛乳やバナナで足す
  if(tg.k-k>=170){ put(ADDON.milk); if(tg.k-k>=90) put(ADDON.banana); }
  else if(tg.k-k>=100) put(ADDON.milk);
  // 合い具合: たんぱく質は「足りない」を重く、「多い」は軽く見る。カロリーは目安との差
  const pd=(p-tg.p)/tg.p, score=(pd<0?-pd*1.5:pd*.4)+Math.abs(k-tg.k)/tg.k;
  return {name:m.name,items,adds,k:Math.round(k/10)*10,p:Math.round(p),f:Math.round(f),c:Math.round(c),score};
}
const mealOptions=(sid,style)=>{ const tg=slotTarget(sid); return MEALS.filter(m=>m.slots.includes(sid)&&m.st===style).map(m=>fitMeal(m,tg)).sort((a,b)=>a.score-b.score); };
function mealPick(sid,style,date,k){
  const o=mealOptions(sid,style); if(!o.length) return null;
  const i0=Math.floor(rnd(date+'|'+sid+'|'+style)*Math.min(3,o.length));
  return o[(i0+(k||0))%o.length];
}

// 研究発表（週に1回。月曜から日曜の成果を S〜C で判定する）
function weekReport(mon){
  const p=S.profile, sh=planShape(), ps={}, pe={};
  let trained=0, checks=0, meals=0, n=0;
  for(let i=0;i<7;i++){
    const d=addDays(mon,i); if(d<S.created) continue;
    n++;
    const r=S.days[d]; if(!r) continue;
    if(r.done) checks++;
    if(r.t==='train'&&r.done){ trained++; (r.pp||[]).forEach(x=>{ ps[x]=1; }); Object.keys(r.exp||{}).forEach(k=>{ pe[k]=(pe[k]||0)+r.exp[k]; }); }
    meals+=(r.meals||'').length;
  }
  if(!n) return {any:false};
  const goal=Math.max(1,Math.round(p.freq*n/7)), np=Object.keys(ps).length, maxP=Math.min(6,goal*sh.K);
  const sc=Math.round(Math.min(1,trained/goal)*50+(checks/n)*20+(meals/(4*n))*20+Math.min(1,np/maxP)*10);
  const g=sc>=85?'S':sc>=70?'A':sc>=45?'B':'C';
  let top=null; Object.keys(pe).forEach(k=>{ if(top===null||pe[k]>pe[top]) top=k; });
  return {any:checks>0||meals>0,mon,score:sc,grade:g,rp:{S:200,A:120,B:60,C:20}[g],trained,goal,checks,n,meals,np,maxP,top};
}
function checkWeekly(){
  const mon=addDays(mondayOf(today()),-7);
  if(S.weeks[mon]) return;
  if(S.created>addDays(mon,6)) return;
  const r=weekReport(mon);
  if(!r.any){ S.weeks[mon]={skip:1}; return; }
  const no=Object.keys(S.weeks).filter(k=>!S.weeks[k].skip).length+1;
  S.weeks[mon]={g:r.grade,sc:r.score,rp:r.rp,tr:r.trained,go:r.goal,ck:r.checks,n:r.n,ml:r.meals,np:r.np,mp:r.maxP,top:r.top,no};
  gainRP(r.rp); pending.week=mon;
}
function logWeight(kg){
  kg=clamp(Math.round(kg*10)/10,30,200);
  const d=today(), w=S.weights, i=w.findIndex(x=>x.d===d);
  if(i>=0) w[i].kg=kg; else w.push({d,kg});
  w.sort((a,b)=>a.d<b.d?-1:1);
  if(w.length>400) w.splice(0,w.length-400);
  S.profile.weight=kg; save();
}

    +'<text x="236" y="222" text-anchor="end" class="rd-s">外側の線 = Lv.'+top+'</text></svg>';

// 体重の推移（直近30件。横軸は日付の間隔どおり）
function weightSVG(){
  const w=S.weights.slice(-30);
  if(w.length<2) return '';
  const Wd=320, Hd=132, l=38, r=14, t=14, b=24;
  let lo=Math.min.apply(null,w.map(x=>x.kg)), hi=Math.max.apply(null,w.map(x=>x.kg));
  if(hi-lo<1){ const mid=(hi+lo)/2; lo=mid-.5; hi=mid+.5; }
  lo=Math.floor(lo*2)/2; hi=Math.ceil(hi*2)/2;
  const span=Math.max(1,diffDays(w[0].d,w[w.length-1].d));
  const X=d=>r2(l+(Wd-l-r)*diffDays(w[0].d,d)/span), Y=k=>r2(t+(Hd-t-b)*(1-(k-lo)/(hi-lo)));
  const pts=w.map(x=>X(x.d)+','+Y(x.kg));
  const last=w[w.length-1], mid=(lo+hi)/2;
  let grid='';
  [lo,mid,hi].forEach(k=>{ grid+='<path d="M'+l+' '+Y(k)+'H'+(Wd-r)+'" stroke="#FFFFFF" stroke-opacity=".08"/><text x="'+(l-6)+'" y="'+(Y(k)+3.5)+'" text-anchor="end" class="wt-a">'+k.toFixed(1)+'</text>'; });
  return '<svg class="wchart" viewBox="0 0 '+Wd+' '+Hd+'" role="img" aria-label="体重の推移">'+grid
    +'<path d="M'+pts[0]+'L'+pts.join('L')+'L'+X(last.d)+' '+(Hd-b)+'L'+l+' '+(Hd-b)+'Z" fill="#5CC9FF" fill-opacity=".1"/>'
    +'<polyline points="'+pts.join(' ')+'" fill="none" stroke="#5CC9FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<circle cx="'+X(last.d)+'" cy="'+Y(last.kg)+'" r="4" fill="#5CC9FF" stroke="#0E1525" stroke-width="2"/>'
    +'<text x="'+l+'" y="'+(Hd-7)+'" class="wt-a">'+mdLabel(w[0].d)+'</text><text x="'+(Wd-r)+'" y="'+(Hd-7)+'" text-anchor="end" class="wt-a">'+mdLabel(last.d)+'</text></svg>';
}

let AC=null;
function actx(){
  if(!S.set.sound) return null;
  try{
    if(!AC){ const Cx=window.AudioContext||window.webkitAudioContext; if(!Cx) return null; AC=new Cx(); }
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function tone(freq,dur,type,vol,when){
  const c=actx(); if(!c) return;
  try{
    const t=c.currentTime+(when||0), o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.1,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.03);
  }catch(e){}
}

let avAnim=0;
function animateAvatar(id,draw,dur){
  const el=document.getElementById(id); if(!el) return;
  if(REDUCED){ el.innerHTML=draw(1); return; }
  const my=++avAnim, t0=performance.now();
  const step=t=>{
    if(my!==avAnim||!el.isConnected) return;
    const k=clamp((t-t0)/dur,0,1);
    el.innerHTML=draw(k);
    if(k<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

const W={open:false,phase:'list',reps:0,endAt:0,total:0,timer:null,prep:false,side:0,next:'',result:null,lastTick:0};
let wakeLock=null;
function wakeOn(){ try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(l=>{ wakeLock=l; },()=>{}); }catch(e){} }
function wakeOff(){ try{ if(wakeLock) wakeLock.release(); }catch(e){} wakeLock=null; }
const curItem=()=>{ const c=S.cur, i=c.prog.i; return {i,it:c.plan.items[i],e:EXM[c.plan.items[i].id]}; };
function seekNext(){
  const c=S.cur, pr=c.prog;
  for(let i=0;i<c.plan.items.length;i++){ if(!pr.skip[i]&&pr.sets[i].length<c.plan.items[i].sets){ pr.i=i; return true; } }
  return false;
}
function openWk(){
  const c=S.cur; if(!c||c.type!=='train'||c.finished||W.open) return;
  W.open=true; W.result=null; W.phase='list';
  if(hasSets(c)&&seekNext()){ W.phase='work'; W.reps=curItem().it.reps; wakeOn(); }
  const el=document.createElement('div');
  el.className='full wk'; el.id='wk';
  el.innerHTML='<div class="full-in" id="wk-in"></div>';
  $('#layer').appendChild(el);
  renderWk();
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));
}
function closeWk(){
  stopTimer(); wakeOff(); W.open=false;
  const el=$('#wk');
  if(el){ el.classList.remove('on'); setTimeout(()=>el.remove(),REDUCED?0:260); }
  if(S.cur.date!==today()) startDay();
  TAB='home'; renderTabs(); render(true);
  setTimeout(flushEvents,420);
}
function stopTimer(){ if(W.timer){ clearInterval(W.timer); W.timer=null; } }
function startTimer(sec){
  stopTimer();
  W.total=sec*1000; W.endAt=Date.now()+W.total; W.lastTick=0;
  W.timer=setInterval(tickWk,200);
}
function tickWk(){
  const left=W.endAt-Date.now();
  if(left<=0){ stopTimer(); timerEnd(); return; }
  const n=$('#tm-n'), v=$('#tm-v'), s=Math.ceil(left/1000);
  if(n&&n.textContent!==String(s)){ n.textContent=s; if(s<=3&&s!==W.lastTick){ W.lastTick=s; sfx.tick(); } }
  if(v){ const len=2*Math.PI*88; v.setAttribute('stroke-dasharray',(len*clamp(left/W.total,0,1)).toFixed(1)+' '+len.toFixed(1)); }
}
function timerEnd(){
  if(W.phase==='rest'){ sfx.rest(); buzz([60,60,60]); W.phase='work'; renderWk(); return; }
  if(W.phase==='count'){
    const e=curItem().e;
    if(W.prep){ W.prep=false; sfx.set(); buzz(30); renderWk(); startTimer(W.reps); return; }
    if(e.each&&W.side===0){ W.side=1; W.prep=true; sfx.rest(); buzz([60,60]); renderWk(); startTimer(4); return; }
    sfx.rest(); buzz([60,60,60]);
    completeSet();
  }
}
function completeSet(){
  const c=S.cur, pr=c.prog, x=curItem();
  pr.sets[x.i].push(W.reps); save();
  if(W.phase!=='count'){ sfx.set(); buzz(25); }
  const more=pr.sets[x.i].length<x.it.sets;
  if(!more&&!seekNext()){ stopTimer(); W.phase='feel'; renderWk(); return; }
  const nx=curItem();
  W.next=more?x.e.name+'（セット '+(pr.sets[x.i].length+1)+' / '+x.it.sets+'）':nx.e.name+'（セット 1 / '+nx.it.sets+'）';
  W.reps=nx.it.reps;
  W.phase='rest'; renderWk(); startTimer(restSec(x.e));
}

// 確認・テスト用の入口（?debug=1 を付けたときだけ window.__mlab として出す）
const API={
  VERSION,EX,PARTS,MEALS,RANKS,SLOTS,pending,today,addDays,diffDays,
  get S(){ return S; }, set S(v){ S=v; },
  load,save,defaults,normalize,startDay,decideType,buildPlan,finishWorkout,restCheckIn,toggleMeal,nutrition,slotTarget,mealPick,mealOptions,
  lvInfo,rankIdx,weekReport,checkWeekly,candidates,initProg,setRestToday,setTrainToday,replanToday,recLeft,isReady,streakNow,swapItem,logWeight,targetReps,avatarSVG,growthAll,
  shiftDays(n){
    devOffset+=n*86400000;
    try{ sessionStorage.setItem('musclelab.dev',String(devOffset)); }catch(e){}
    if(HAS_DOM&&S.onboarded){ startDay(); render(); setTimeout(flushEvents,300); }
    return today();
  },
  simulate(feel){
    const c=S.cur; if(!c||c.type!=='train'||c.finished) return null;
    const pr=initProg();
    c.plan.items.forEach((it,i)=>{ while(pr.sets[i].length<it.sets) pr.sets[i].push(it.reps); });
    const r=finishWorkout(feel||'ok');
    if(HAS_DOM) render();
    return r;
  },
  reset(){ store.del(); devOffset=0; try{ sessionStorage.removeItem('musclelab.dev'); }catch(e){} S=defaults(); },
};

  clearTimeout(holdT); clearInterval(holdI); holdT=holdI=null;
  // 指を離した直後のクリック1回だけを無視する。ボタンの外で離したときに印が残らないよう、少しあとで戻す
  if(holdFired) setTimeout(()=>{ holdFired=false; },80);
}
function boot(){
  load();
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
    if(holdFired&&el.closest('.stepper')){ holdFired=false; return; }
    const f=ACT[el.dataset.act]; if(f) f(el,e);
  });
  document.addEventListener('pointerdown',e=>{
    const el=e.target.closest('.stepper [data-act]'); if(!el) return;
    holdStop(); holdFired=false;
    holdT=setTimeout(()=>{ holdI=setInterval(()=>{ if(!el.isConnected){ holdStop(); return; } holdFired=true; const f=ACT[el.dataset.act]; if(f) f(el,e); },90); },420);
  });
  ['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,holdStop));
  window.addEventListener('blur',holdStop);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&SHEETS.length){ closeSheet(SHEETS[SHEETS.length-1]); return; }
    if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.matches&&e.target.matches('g[data-act]')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); }
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='pf-name'){ S.profile.name=(e.target.value.trim()||'マッスル1号').slice(0,12); save(); const n=$('.np-name'); if(n) n.textContent=S.profile.name; }
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){ dayWatch(); if(W.open&&W.phase!=='list'&&W.phase!=='result'&&W.phase!=='feel') wakeOn(); }
  });
  setInterval(dayWatch,60000);
  renderTabs();
  if(!S.onboarded) openOnboarding();
  else{ startDay(); render(true); setTimeout(flushEvents,700); }
  if(/[?&]debug=1/.test(location.search)) window.__mlab=API;
}
if(typeof globalThis!=='undefined'&&typeof globalThis.__MLAB_TEST__==='function') globalThis.__MLAB_TEST__(API);
if(HAS_DOM&&document.getElementById('view')) boot();
})();
</script>
